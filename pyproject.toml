[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sondelab"
version = "0.1.0"
description = "Controlled experiments on language-model reliability"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sondelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
